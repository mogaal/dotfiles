# Re-assigning C-b to C-x
set-option -g prefix C-s

bind q killp
bind space command-prompt -p index "select-window"

# Set buffer size
set -g history-limit 100000

# Set mode-keys to vi
set-window-option -g mode-keys vi

# Allows for faster key repetition
set -s escape-time 0

# C-b C-b will swap to last used window
bind-key C-s last-window

# Set window notifications
setw -g monitor-activity off
set -g visual-activity off

# Base for numbering is 1, not 0
set -g base-index 1

# To lock tmux - (can't find it useful anymore)
#set -g lock-after-time 3600
#set -g lock-command "vlock"

# Change split default keys
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind C-k resize-pane -U 5
bind C-j resize-pane -D 5
bind C-h resize-pane -L 5
bind C-l resize-pane -R 5

# VIM panes moving
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Avoid renamed windows
set-option -g allow-rename off

# Reload the tmux configuration file
bind R source-file ~/.tmux.conf \; display-message "source-file done"

# Activate mouse mode
set -g mouse on

###########################
# Some style for the bar ##
###########################
# Gruvbox-dark palette, to match vim

set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#282828,fg=#ebdbb2"

set -g status-left-length 20
set -g status-left "#[bg=#fabd2f,fg=#282828,bold] #S #[bg=#282828,fg=#282828,nobold]"

set -g status-right-length 50
set -g status-right "#[fg=#928374,bg=#282828]#[bg=#3c3836,fg=#ebdbb2] %H:%M #[bg=#504945,fg=#ebdbb2] %d-%b-%y "

setw -g window-status-separator ""
setw -g window-status-format " #I:#W "
setw -g window-status-style "bg=#282828,fg=#928374"

setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=#504945,fg=#fe8019,bold"

######################
### OS associated ####
######################

# For OSX
if-shell 'test "$(uname -s)" = "Darwin"' \
  'source ~/.tmux.osx.conf'

# For Linux
if-shell 'test "$(uname -s)" = "Linux"' \
  'source ~/.tmux.linux.conf'

